      "3": {name: PA7, kind: OUT, xy: [-2.7, -0.635], size: [1.50, 0.65]}
      "4": {name: PA1, kind: OUT, xy: [-2.7, -1.905], size: [1.50, 0.65]}
      "5": {name: PA2, kind: OUT, xy: [2.7, -1.905], size: [1.50, 0.65]}
